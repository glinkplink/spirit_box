name: Internal TestFlight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Spirit Box commit SHA to build and upload to Internal TestFlight
        required: true
        type: string

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to Internal TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROJECT_PATH: ios/SpiritBoxAudioHarness.xcodeproj
      SCHEME_NAME: SpiritBoxAudioHarness
      APP_TARGET: SpiritBoxAudioHarness
      REQUIRED_BUNDLE_ID: com.glinkplink.spiritbox

    steps:
      - name: Print toolchain
        run: |
          set -euo pipefail
          echo "=== macOS ==="
          sw_vers
          echo "=== Xcode ==="
          xcode_version_output="$(xcodebuild -version)"
          printf '%s\n' "${xcode_version_output}"
          echo "=== Developer directory ==="
          xcode-select -p

      - name: Validate secrets and materialize API key
        id: secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=0
          if [[ -z "$(printf '%s' "${APPLE_TEAM_ID:-}" | tr -d '[:space:]')" ]]; then
            echo "::error::Repository secret APPLE_TEAM_ID is missing or empty."
            missing=1
          fi
          if [[ -z "$(printf '%s' "${ASC_KEY_ID:-}" | tr -d '[:space:]')" ]]; then
            echo "::error::Repository secret ASC_KEY_ID is missing or empty."
            missing=1
          fi
          if [[ -z "$(printf '%s' "${ASC_ISSUER_ID:-}" | tr -d '[:space:]')" ]]; then
            echo "::error::Repository secret ASC_ISSUER_ID is missing or empty."
            missing=1
          fi
          if [[ -z "$(printf '%s' "${ASC_PRIVATE_KEY:-}" | tr -d '[:space:]')" ]]; then
            echo "::error::Repository secret ASC_PRIVATE_KEY is missing or empty."
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "::error::All of APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, and ASC_PRIVATE_KEY must be non-empty."
            exit 1
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          umask 077
          printf '%s\n' "${ASC_PRIVATE_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          if ! grep -Eq 'BEGIN .*PRIVATE KEY' "${key_path}"; then
            echo "::error::ASC_PRIVATE_KEY does not look like a PEM private key (missing BEGIN PRIVATE KEY header)."
            rm -f "${key_path}"
            exit 1
          fi

          {
            echo "KEY_PATH=${key_path}"
            echo "ARCHIVE_PATH=${RUNNER_TEMP}/SpiritBox.xcarchive"
            echo "EXPORT_PATH=${RUNNER_TEMP}/SpiritBoxExport"
            echo "EXPORT_OPTIONS_PATH=${RUNNER_TEMP}/ExportOptions.plist"
          } >> "${GITHUB_ENV}"

      - name: Validate source_sha format
        id: sha_format
        run: |
          set -euo pipefail
          requested=$(printf '%s' "${SOURCE_SHA}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if ! [[ "${requested}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be the full 40-character Spirit Box commit SHA. Got: '${SOURCE_SHA}'."
            exit 1
          fi

      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        id: sha_checkout
        run: |
          set -euo pipefail
          requested=$(printf '%s' "${SOURCE_SHA}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          actual=$(git rev-parse HEAD)
          echo "Requested source SHA: ${requested}"
          echo "Checked-out git SHA: ${actual}"
          if [[ "${actual}" != "${requested}" ]]; then
            echo "::error::Checked-out SHA ${actual} does not exactly equal source_sha (${SOURCE_SHA}). Pass the full 40-character commit SHA."
            exit 1
          fi
          echo "CHECKED_OUT_SHA=${actual}" >> "${GITHUB_ENV}"

      - name: Verify Xcode project exists
        id: project
        run: |
          set -euo pipefail
          if [[ ! -d "${PROJECT_PATH}" ]]; then
            echo "::error::${PROJECT_PATH} is missing at the requested SHA ${CHECKED_OUT_SHA}."
            ls -la
            ls -la ios || true
            exit 1
          fi
          echo "Found ${PROJECT_PATH}"

      - name: Verify shared SpiritBoxAudioHarness scheme exists
        id: scheme
        run: |
          set -euo pipefail
          scheme_file="${PROJECT_PATH}/xcshareddata/xcschemes/${SCHEME_NAME}.xcscheme"
          if [[ ! -f "${scheme_file}" ]]; then
            echo "::error::Shared scheme ${SCHEME_NAME} is missing at ${scheme_file}."
            echo "Project listing:"
            xcodebuild -list -project "${PROJECT_PATH}" || true
            exit 1
          fi
          echo "Found ${scheme_file}"
          echo "=== xcodebuild -list ==="
          xcodebuild -list -project "${PROJECT_PATH}"
          if ! xcodebuild -list -project "${PROJECT_PATH}" | grep -Fq "${SCHEME_NAME}"; then
            echo "::error::xcodebuild -list did not include scheme ${SCHEME_NAME}."
            exit 1
          fi

      - name: Read bundle ID and marketing version
        id: identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          required_bundle_id = os.environ["REQUIRED_BUNDLE_ID"]
          project = os.environ["PROJECT_PATH"]
          scheme = os.environ["SCHEME_NAME"]
          app_target = os.environ["APP_TARGET"]

          proc = subprocess.run(
              [
                  "xcodebuild",
                  "-project", project,
                  "-scheme", scheme,
                  "-configuration", "Release",
                  "-showBuildSettings",
                  "-json",
                  "CODE_SIGNING_ALLOWED=NO",
              ],
              capture_output=True,
              text=True,
          )
          text = (proc.stdout or "") + (proc.stderr or "")
          start = text.find("[")
          if proc.returncode != 0 or start == -1:
              print("::error::xcodebuild -showBuildSettings -json failed.")
              print(text)
              sys.exit(1)

          decoder = json.JSONDecoder()
          entries, _ = decoder.raw_decode(text[start:])
          chosen = None
          for entry in entries:
              if entry.get("target") == app_target:
                  chosen = entry
                  break
          if chosen is None and entries:
              chosen = entries[0]
          if chosen is None:
              print("::error::xcodebuild returned no build settings.")
              sys.exit(1)

          settings = chosen.get("buildSettings") or {}
          bundle_id = (settings.get("PRODUCT_BUNDLE_IDENTIFIER") or "").strip()
          marketing_version = (settings.get("MARKETING_VERSION") or "").strip()
          product_name = (settings.get("PRODUCT_NAME") or "").strip()
          full_product = (settings.get("FULL_PRODUCT_NAME") or "").strip()
          if not bundle_id:
              print("::error::Could not read PRODUCT_BUNDLE_IDENTIFIER from SpiritBoxAudioHarness Release build settings.")
              sys.exit(1)
          if bundle_id != required_bundle_id:
              print(
                  f"::error::PRODUCT_BUNDLE_IDENTIFIER is '{bundle_id}', expected exactly '{required_bundle_id}'. Refusing to upload."
              )
              sys.exit(1)
          if not marketing_version:
              print("::error::Could not read MARKETING_VERSION from SpiritBoxAudioHarness Release build settings.")
              sys.exit(1)
          if not full_product:
              if product_name.endswith(".app"):
                  full_product = product_name
              elif product_name:
                  full_product = f"{product_name}.app"
              else:
                  full_product = f"{app_target}.app"

          print(f"Bundle ID: {bundle_id}")
          print(f"Marketing version: {marketing_version}")
          print(f"Product name: {product_name or '<empty>'}")
          print(f"Archive app filename: {full_product}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"BUNDLE_ID={bundle_id}\n")
              handle.write(f"MARKETING_VERSION={marketing_version}\n")
              handle.write(f"ARCHIVE_APP_NAME={full_product}\n")
          PY

      - name: Run iOS unit tests
        id: tests
        run: |
          set -euo pipefail
          ./scripts/ci-ios-test.sh
          echo "TEST_RESULT=passed" >> "${GITHUB_ENV}"

      - name: Inspect xcodebuild export options
        run: |
          set -euo pipefail
          help_file="${RUNNER_TEMP}/xcodebuild-help.txt"
          docs_file="${RUNNER_TEMP}/xcodebuild-docs.txt"
          echo "=== xcodebuild -help ==="
          xcodebuild -help > "${help_file}" 2>&1 || true
          cat "${help_file}"
          cp "${help_file}" "${docs_file}"

          if man xcodebuild >/dev/null 2>&1; then
            echo "=== man xcodebuild (export-related) ==="
            man xcodebuild | col -b >> "${docs_file}"
            grep -i -E 'exportOptions|app-store|destination|signingStyle|manageAppVersion|teamID|testFlightInternalTestingOnly' "${docs_file}" | head -120 || true
          fi

          method="app-store-connect"
          if grep -Fqi 'app-store-connect' "${docs_file}"; then
            echo "Confirmed export method: app-store-connect"
          elif grep -Eiq 'method[[:space:]].*app-store' "${docs_file}"; then
            method="app-store"
            echo "xcodebuild documents method app-store; using that instead of app-store-connect."
          else
            echo "xcodebuild -help/man did not enumerate export methods; using documented Xcode 16+ method app-store-connect."
          fi

          for key in destination signingStyle teamID manageAppVersionAndBuildNumber; do
            if grep -Fqi "${key}" "${docs_file}"; then
              echo "Confirmed export option key: ${key}"
            else
              echo "Note: ${key} is not mentioned in xcodebuild -help/man; still emitting the documented Xcode 16+ key."
            fi
          done

          # Enable Internal-TestFlight-only export when this Xcode documents the key.
          testflight_internal="false"
          if grep -Fqi 'testFlightInternalTestingOnly' "${docs_file}"; then
            testflight_internal="true"
            echo "Enabling ExportOptions testFlightInternalTestingOnly=true (documented by this Xcode)."
          else
            echo "Leaving testFlightInternalTestingOnly unset; xcodebuild -help/man did not document it."
          fi

          {
            echo "EXPORT_METHOD=${method}"
            echo "EXPORT_TESTFLIGHT_INTERNAL=${testflight_internal}"
          } >> "${GITHUB_ENV}"

      - name: Print resolved Release signing settings
        run: |
          set -euo pipefail
          echo "Resolved SpiritBoxAudioHarness Release settings for the unsigned archive invocation."
          echo "These are diagnostic only. Secrets are not printed."
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          keys = [
              "CODE_SIGN_STYLE",
              "CODE_SIGN_IDENTITY",
              "CODE_SIGNING_ALLOWED",
              "CODE_SIGNING_REQUIRED",
              "DEVELOPMENT_TEAM",
              "PRODUCT_BUNDLE_IDENTIFIER",
              "FULL_PRODUCT_NAME",
              "PRODUCT_NAME",
              "PROVISIONING_PROFILE",
              "PROVISIONING_PROFILE_SPECIFIER",
              "CODE_SIGN_ENTITLEMENTS",
          ]
          proc = subprocess.run(
              [
                  "xcodebuild",
                  "-project", os.environ["PROJECT_PATH"],
                  "-scheme", os.environ["SCHEME_NAME"],
                  "-configuration", "Release",
                  "-destination", "generic/platform=iOS",
                  "-showBuildSettings",
                  "-json",
                  "CODE_SIGNING_ALLOWED=NO",
                  "CODE_SIGNING_REQUIRED=NO",
                  "CURRENT_PROJECT_VERSION={}".format(os.environ["GITHUB_RUN_NUMBER"]),
              ],
              capture_output=True,
              text=True,
          )
          text = (proc.stdout or "") + (proc.stderr or "")
          start = text.find("[")
          if proc.returncode != 0 or start == -1:
              print("::error::xcodebuild -showBuildSettings -json failed.")
              print(text)
              sys.exit(1)

          decoder = json.JSONDecoder()
          entries, _ = decoder.raw_decode(text[start:])
          app_target = os.environ["APP_TARGET"]
          chosen = None
          for entry in entries:
              if entry.get("target") == app_target:
                  chosen = entry
                  break
          if chosen is None and entries:
              chosen = entries[0]
          if chosen is None:
              print("::error::xcodebuild returned no build settings.")
              sys.exit(1)

          settings = chosen.get("buildSettings") or {}
          team_secret = (os.environ.get("APPLE_TEAM_ID") or "").strip()
          print("=== Resolved SpiritBoxAudioHarness Release signing settings ===")
          for key in keys:
              value = settings.get(key)
              if value is None or value == "":
                  rendered = "<empty>"
              else:
                  rendered = str(value)
                  if team_secret and rendered == team_secret:
                      rendered = "<redacted>"
              print(f"{key}={rendered}")
          PY

      - name: Archive Release for iOS device
        id: archive
        run: |
          set -euo pipefail
          echo "Archiving SpiritBoxAudioHarness Release for generic/platform=iOS"
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}"
          echo "Archive signing: disabled (CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)."
          echo "Distribution signing happens later at -exportArchive, not during archive."
          echo "This archive must not request an iOS App Development profile, a registered device, or a CODE_SIGN_IDENTITY override."
          # Automatic signing during archive asks Apple for an iOS App Development
          # profile. Those profiles are device-bound. Archive without signing;
          # App Store Connect / TestFlight distribution signing is applied at export.
          xcodebuild \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive
          if [[ ! -d "${ARCHIVE_PATH}" ]]; then
            echo "::error::xcodebuild archive reported success but ${ARCHIVE_PATH} was not created."
            exit 1
          fi

          apps_dir="${ARCHIVE_PATH}/Products/Applications"
          expected_name="${ARCHIVE_APP_NAME:-SpiritBoxAudioHarness.app}"
          app_path=""
          shopt -s nullglob
          found_apps=("${apps_dir}"/*.app)
          shopt -u nullglob
          if [[ -d "${apps_dir}/${expected_name}" ]]; then
            app_path="${apps_dir}/${expected_name}"
          elif [[ "${#found_apps[@]}" -eq 1 ]]; then
            app_path="${found_apps[0]}"
            echo "Using discovered archive app: ${app_path}"
          fi
          if [[ -z "${app_path}" || ! -d "${app_path}" ]]; then
            echo "::error::Archive is missing an application bundle under Products/Applications."
            echo "Expected: ${apps_dir}/${expected_name}"
            echo "Archive listing:"
            ls -la "${ARCHIVE_PATH}" || true
            ls -la "${ARCHIVE_PATH}/Products" || true
            ls -la "${apps_dir}" || true
            exit 1
          fi
          echo "Archive contains ${app_path}"
          echo "=== codesign --display (unsigned is expected at this stage) ==="
          codesign_status=0
          codesign_output="$(codesign --display --verbose=2 "${app_path}" 2>&1)" || codesign_status=$?
          printf '%s\n' "${codesign_output}"
          if [[ "${codesign_status}" -eq 0 ]]; then
            echo "Archive app currently has a code signature."
          else
            echo "Archive app is unsigned (expected: archive disables signing; export applies App Store Connect distribution signing)."
          fi
          if [[ -d "${app_path}/_CodeSignature" ]]; then
            echo "Archive app has a _CodeSignature directory."
          else
            echo "Archive app has no _CodeSignature directory."
          fi
          echo "Archive succeeded."

      - name: Export and upload to App Store Connect
        id: export
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import os
          import plistlib
          import sys

          path = os.environ["EXPORT_OPTIONS_PATH"]
          data = {
              "method": os.environ["EXPORT_METHOD"],
              "destination": "upload",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
          }
          if os.environ.get("EXPORT_TESTFLIGHT_INTERNAL") == "true":
              data["testFlightInternalTestingOnly"] = True
          with open(path, "wb") as handle:
              plistlib.dump(data, handle)
          print("ExportOptions method={method} destination={destination} signingStyle={signingStyle}".format(**data))
          print("ExportOptions testFlightInternalTestingOnly={}".format(data.get("testFlightInternalTestingOnly", False)))

          redacted = dict(data)
          if "teamID" in redacted:
              redacted["teamID"] = "<redacted>"
          buf = io.BytesIO()
          plistlib.dump(redacted, buf, fmt=plistlib.FMT_XML)
          print("=== ExportOptions.plist (teamID redacted) ===")
          sys.stdout.write(buf.getvalue().decode("utf-8"))
          PY

          mkdir -p "${EXPORT_PATH}"
          echo "Exporting archive with destination=upload (App Store Connect / TestFlight)."
          echo "Export signing: automatic cloud-managed App Store distribution via App Store Connect API key."
          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          echo "App Store Connect upload succeeded."

      - name: Write success summary
        run: |
          set -euo pipefail
          {
            echo "## Internal TestFlight upload"
            echo
            echo "- Requested source SHA: \`${SOURCE_SHA}\`"
            echo "- Actual checked-out SHA: \`${CHECKED_OUT_SHA}\`"
            echo "- Bundle ID: \`${BUNDLE_ID}\`"
            echo "- Marketing version: \`${MARKETING_VERSION}\`"
            echo "- TestFlight build number: \`${GITHUB_RUN_NUMBER}\`"
            echo "- Tests/build result: \`${TEST_RESULT:-passed}\`"
            echo "- Archive succeeded"
            echo "- App Store Connect upload succeeded"
            echo "- Apple processing may take several minutes before the build appears in Internal TestFlight"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Diagnose workflow failure
        if: failure()
        run: |
          set -euo pipefail
          echo "::error::Spirit Box TestFlight archives unsigned (CODE_SIGNING_ALLOWED=NO), then applies Apple automatic/cloud-managed App Store Connect distribution signing at -exportArchive. This workflow does not fall back to Development signing, device/UDID registration, ad-hoc signing, local .p12 certificates, or committed profiles."
          if [[ "${{ steps.secrets.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: secret missing or ASC_PRIVATE_KEY is not a PEM private key. Check APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY."
          fi
          if [[ "${{ steps.sha_format.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: invalid source_sha. Pass the full 40-character git SHA."
          fi
          if [[ "${{ steps.sha_checkout.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: wrong checkout SHA. git rev-parse HEAD did not match source_sha."
          fi
          if [[ "${{ steps.project.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: Xcode project missing at ios/SpiritBoxAudioHarness.xcodeproj."
          fi
          if [[ "${{ steps.scheme.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: shared scheme SpiritBoxAudioHarness missing."
          fi
          if [[ "${{ steps.identity.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: could not read identity settings, or PRODUCT_BUNDLE_IDENTIFIER is not exactly com.glinkplink.spiritbox."
          fi
          if [[ "${{ steps.tests.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: ./scripts/ci-ios-test.sh failed. The requested SHA was not uploaded."
          fi
          if [[ "${{ steps.archive.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: archive failure. Inspect xcodebuild archive output. Unsigned archive for generic/platform=iOS is intentional; do not add Development signing."
          fi
          if [[ "${{ steps.export.outcome }}" == "failure" ]]; then
            echo "::error::Failure class: export/upload failure. Inspect the exact xcodebuild -exportArchive error. Typical causes: App Store Connect API-key authentication (key id/issuer/role), cloud-managed distribution certificate or provisioning permissions, or App Store Connect upload rejection. Do not switch to Development signing or device registration."
          fi

      - name: Remove App Store Connect API key
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${KEY_PATH:-}" && -f "${KEY_PATH}" ]]; then
            rm -f "${KEY_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/AuthKey_"*.p8
          if [[ -n "${EXPORT_OPTIONS_PATH:-}" && -f "${EXPORT_OPTIONS_PATH}" ]]; then
            rm -f "${EXPORT_OPTIONS_PATH}"
          fi
