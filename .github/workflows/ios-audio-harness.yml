name: iOS audio harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact 40-character SHA to render. Empty uses the selected ref. A skipped iOS-relevance job is not audio validation.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      ios_relevant: ${{ steps.classify.outputs.ios_relevant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_sha || github.sha }}

      - name: Classify changed files
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-classify-ios-changes.sh

  build-and-test:
    needs: classify-changes
    runs-on: ${{ needs.classify-changes.outputs.ios_relevant == 'true' && 'macos-15' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha || github.sha }}

      - name: Skip full iOS CI (no iOS-relevant changes)
        if: needs.classify-changes.outputs.ios_relevant != 'true'
        run: |
          echo "No iOS-relevant files changed in this event."
          echo "ios_relevant=false — skipping Xcode, simulator, and ./scripts/ci-ios-test.sh."
          echo "The build-and-test required check still resolves successfully on Ubuntu."

      - name: Show Xcode version
        if: needs.classify-changes.outputs.ios_relevant == 'true'
        run: xcodebuild -version

      - name: Verify Release Info.plist exposes Documents to Files
        if: needs.classify-changes.outputs.ios_relevant == 'true'
        run: ./scripts/ci-verify-harness-release-plist.sh Release

      - name: Build iOS target and run unit tests
        if: needs.classify-changes.outputs.ios_relevant == 'true'
        run: ./scripts/ci-ios-test.sh

  render-final-mix:
    needs: classify-changes
    if: needs.classify-changes.outputs.ios_relevant == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha || github.sha }}
      - name: Render 60s 300ms candidate and matched baseline first
        run: |
          ./scripts/render-short-listening.sh --preset listening-test --rate 300 --seconds 60 --also-baseline --skip-acoustics
          mkdir -p build/listening-60s-300ms
          cp -a "$(cat build/listening-runs/latest-candidate.txt)"/. build/listening-60s-300ms/
          python3 tools/check_sweep_render.py build/listening-60s-300ms
      - name: Upload 60s listening clips immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listening-60s-first
          path: |
            build/listening-runs/
            build/listening-60s-300ms/
          if-no-files-found: error
      - name: Remaining actual-engine render suite
        run: |
          ./scripts/render-sweep.sh ios/Phase1 build/listening-30s-300ms 30 300 forward 12648430
          python3 tools/check_sweep_render.py build/listening-30s-300ms --compare-prefix build/listening-60s-300ms
          ./scripts/render-sweep.sh ios/Phase1 build/listening-60s-200ms 60 200 forward 12648430
          python3 tools/check_sweep_render.py build/listening-60s-200ms
          for rate in 75 125; do
            ./scripts/render-sweep.sh ios/Phase1 "build/rate-${rate}" 30 "$rate" forward 12648430
            python3 tools/check_sweep_render.py "build/rate-${rate}"
          done
          ./scripts/render-sweep.sh ios/Phase1 build/reverse-30s 30 300 reverse 12648430
          python3 tools/check_sweep_render.py build/reverse-30s
          SPIRIT_BOX_LEVEL_AUDIT=1 ./scripts/render-sweep.sh ios/Phase1 build/listening-2min 120 200 forward 12648430
          python3 tools/check_sweep_render.py build/listening-2min
          ./scripts/render-sweep.sh ios/Phase1 build/listening-12min 720 300 forward 1234
          python3 tools/check_sweep_render.py build/listening-12min
      - name: Measure loudness, true peak, spectrum and empty-slot cadence
        run: |
          python3 -m venv build/acoustic-venv
          build/acoustic-venv/bin/pip install numpy
          command -v ffmpeg || brew install ffmpeg
          build/acoustic-venv/bin/python tools/check_sweep_acoustics.py build/listening-60s-300ms
          build/acoustic-venv/bin/python tools/check_sweep_acoustics.py build/listening-60s-200ms
          if [[ -f build/listening-runs/latest-baseline.txt ]]; then
            build/acoustic-venv/bin/python tools/check_sweep_acoustics.py "$(cat build/listening-runs/latest-baseline.txt)" || true
          fi
      - name: Upload real rendered mix and source traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-engine-listening-samples
          path: |
            build/listening-*/
            build/listening-runs/
            build/rate-*/
            build/reverse-*/
          if-no-files-found: error
