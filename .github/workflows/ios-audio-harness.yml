name: iOS audio harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      ios_relevant: ${{ steps.classify.outputs.ios_relevant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-classify-ios-changes.sh

  build-and-test:
    needs: classify-changes
    runs-on: ${{ needs.classify-changes.outputs.ios_relevant == 'true' && 'macos-15' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip full iOS CI (no iOS-relevant changes)
        if: needs.classify-changes.outputs.ios_relevant != 'true'
        run: |
          echo "No iOS-relevant files changed in this event."
          echo "ios_relevant=false — skipping Xcode, simulator, and ./scripts/ci-ios-test.sh."
          echo "The build-and-test required check still resolves successfully on Ubuntu."

      - name: Show Xcode version
        if: needs.classify-changes.outputs.ios_relevant == 'true'
        run: xcodebuild -version

      - name: Verify Release Info.plist exposes Documents to Files
        if: needs.classify-changes.outputs.ios_relevant == 'true'
        run: ./scripts/ci-verify-harness-release-plist.sh Release

      - name: Build iOS target and run unit tests
        if: needs.classify-changes.outputs.ios_relevant == 'true'
        run: ./scripts/ci-ios-test.sh

  render-final-mix:
    needs: classify-changes
    if: needs.classify-changes.outputs.ios_relevant == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Render the actual app engine (30 seconds first)
        run: |
          ./scripts/render-sweep.sh ios/Phase1 build/listening-30s 30 200 forward 12648430
          python3 tools/check_sweep_render.py build/listening-30s
          build/render-sweep/render-sweep ios/Phase1 build/listening-60s 60 200 forward 12648430
          python3 tools/check_sweep_render.py build/listening-60s
          python3 tools/check_sweep_render.py build/listening-30s --compare-prefix build/listening-60s
          for rate in 75 125 300; do
            build/render-sweep/render-sweep ios/Phase1 "build/rate-${rate}" 30 "$rate" forward 12648430
            python3 tools/check_sweep_render.py "build/rate-${rate}"
          done
          build/render-sweep/render-sweep ios/Phase1 build/reverse-30s 30 200 reverse 12648430
          python3 tools/check_sweep_render.py build/reverse-30s
          SPIRIT_BOX_LEVEL_AUDIT=1 build/render-sweep/render-sweep ios/Phase1 build/listening-2min 120 200 forward 12648430
          python3 tools/check_sweep_render.py build/listening-2min
          build/render-sweep/render-sweep ios/Phase1 build/listening-12min 720 300 forward 1234
          python3 tools/check_sweep_render.py build/listening-12min
      - name: Upload real rendered mix and source traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-engine-listening-samples
          path: |
            build/listening-*/
            build/rate-*/
            build/reverse-*/
          if-no-files-found: error
