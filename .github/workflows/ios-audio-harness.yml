name: iOS audio harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/audio-harness, main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS target and run unit tests
        run: ./scripts/ci-ios-test.sh
